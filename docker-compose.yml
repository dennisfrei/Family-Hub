# Settings come from .env (see envs.example); only what differs inside the compose network is set here.
x-container-env: &container-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  S3_ENDPOINT_URL: http://s3:9000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # S3-compatible storage to test backup and restore (console: http://localhost:9001)
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data

  app:
    build: .
    env_file: .env
    environment: *container-env
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    volumes:
      # Growth reference tables, kept outside git (see README); same relative path as on the host
      - ./data/private/growth-reference:/app/data/private/growth-reference:ro
    depends_on:
      db:
        condition: service_healthy

  # One-off backup/restore runs: docker compose run --rm tools family-hub-backup --s3
  tools:
    build: .
    profiles: [tools]
    env_file: .env
    environment:
      <<: *container-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  # docker compose --profile auth up -d pocket-id
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v1.16.0
    profiles: [auth]
    environment:
      # External URL; Pocket ID needs its own host or port (no path prefix), and passkeys need HTTPS or localhost
      APP_URL: ${POCKET_ID_URL:-http://localhost:1411}
      TRUST_PROXY: "false"
      ANALYTICS_DISABLED: "true"
    ports:
      - "127.0.0.1:1411:1411"
    volumes:
      - pocket-id-data:/app/data

volumes:
  db-data:
  s3-data:
  pocket-id-data:
